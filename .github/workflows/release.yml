name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Build FFmpeg audio decoder
        uses: ./.github/actions/build-ffmpeg-decoder

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE }}" | base64 -d > "$RUNNER_TEMP/keystore.jks"

      - name: Assemble signed release APKs
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :android:assembleRelease -PwithFfmpegDecoder

      - uses: actions/upload-artifact@v7
        with:
          name: android-release
          path: android/build/outputs/apk/release/*.apk
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Cache VLC natives
        uses: actions/cache@v6
        with:
          path: desktop/build/vlc
          key: vlc-natives-${{ hashFiles('desktop/build.gradle.kts') }}

      - name: Package installer
        run: ./gradlew :desktop:packageMsi

      - uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: desktop/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error

  linux:
    name: Linux
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Package .deb
        run: ./gradlew :desktop:packageDebUser

      - uses: actions/upload-artifact@v7
        with:
          name: linux-release
          path: desktop/build/deb/*.deb
          if-no-files-found: error

  appimage:
    name: Linux AppImage
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Install packaging tools and libVLC
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils patchelf \
            libvlc5 libvlccore9 vlc-plugin-base vlc-plugin-video-output
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage
          curl -fsSL -o "$RUNNER_TEMP/linuxdeploy" \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool" "$RUNNER_TEMP/linuxdeploy"

      - name: Package AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: >-
          ./gradlew :desktop:packageAppImage
          -Pappimagetool="$RUNNER_TEMP/appimagetool"
          -Plinuxdeploy="$RUNNER_TEMP/linuxdeploy"

      - uses: actions/upload-artifact@v7
        with:
          name: appimage-release
          path: desktop/build/appimage/*.AppImage
          if-no-files-found: error

  macos:
    name: macOS
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Package .dmg
        run: ./gradlew :desktop:packageDmg

      - uses: actions/upload-artifact@v7
        with:
          name: macos-release
          path: desktop/build/compose/binaries/main/dmg/*.dmg
          if-no-files-found: error

  publish:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/') && always() && needs.android.result == 'success' && needs.windows.result == 'success'
    needs: [android, windows, linux, appimage, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Report a missing Linux build
        if: needs.linux.result != 'success'
        run: >-
          echo "::warning title=No Linux artifact::Linux packaging did not
          succeed (${{ needs.linux.result }}), so this draft has no .deb."

      - name: Report a missing AppImage build
        if: needs.appimage.result != 'success'
        run: >-
          echo "::warning title=No AppImage artifact::AppImage packaging did not
          succeed (${{ needs.appimage.result }}), so this draft has no AppImage."

      - name: Report a missing macOS build
        if: needs.macos.result != 'success'
        run: >-
          echo "::warning title=No macOS artifact::macOS packaging did not
          succeed (${{ needs.macos.result }}), so this draft has no .dmg."

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: |
            artifacts/*.apk
            artifacts/*.msi
            artifacts/*.deb
            artifacts/*.AppImage
            artifacts/*.dmg
