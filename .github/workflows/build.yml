name: Build

on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "**.yml"
      - LICENSE
      - .github/screenshots/**
      - website/**
  pull_request:
    paths-ignore:
      - "**.md"
      - "**.yml"
      - LICENSE
      - .github/screenshots/**
      - website/**
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build FFmpeg audio decoder
        uses: ./.github/actions/build-ffmpeg-decoder

      - name: Decode keystore
        if: ${{ github.event_name != 'pull_request' }}
        run: echo "${{ secrets.KEYSTORE }}" | base64 -d > "$RUNNER_TEMP/keystore.jks"

      - name: Assemble debug APKs
        env:
          KEYSTORE_FILE: ${{ github.event_name != 'pull_request' && format('{0}/keystore.jks', runner.temp) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :android:assembleDebug -PwithFfmpegDecoder -PsplitAbis=false

      - uses: actions/upload-artifact@v7
        with:
          name: TeleDrive-android
          path: android/build/outputs/apk/debug/*-universal-debug.apk
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Desktop tests
        run: ./gradlew :desktop:test

      - name: Cache VLC natives
        uses: actions/cache@v6
        with:
          path: desktop/build/vlc
          key: vlc-natives-${{ hashFiles('desktop/build.gradle.kts') }}

      - name: Package installer
        run: ./gradlew :desktop:packageMsi -PciBuild

      - uses: actions/upload-artifact@v7
        with:
          name: TeleDrive-windows
          path: desktop/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error

  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Desktop tests
        run: ./gradlew :desktop:test

      - name: Package .deb
        run: ./gradlew :desktop:packageDebUser

      - name: Verify the declared dependencies resolve
        run: |
          sudo apt-get update
          sudo apt-get install -y ./desktop/build/deb/*.deb

      - uses: actions/upload-artifact@v7
        with:
          name: TeleDrive-linux
          path: desktop/build/deb/*.deb
          if-no-files-found: error

  appimage:
    name: Linux AppImage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Install packaging tools and libVLC
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils patchelf \
            libvlc5 libvlccore9 vlc-plugin-base vlc-plugin-video-output
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage
          curl -fsSL -o "$RUNNER_TEMP/linuxdeploy" \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool" "$RUNNER_TEMP/linuxdeploy"

      - name: Package AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: >-
          ./gradlew :desktop:packageAppImage
          -Pappimagetool="$RUNNER_TEMP/appimagetool"
          -Plinuxdeploy="$RUNNER_TEMP/linuxdeploy"

      - name: Verify the AppImage carries its launcher and libVLC
        run: |
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE"/desktop/build/appimage/*.AppImage --appimage-extract > /dev/null
          test -x squashfs-root/AppRun
          test -x squashfs-root/bin/TeleDrive
          test -f squashfs-root/lib/app/TeleDrive.cfg
          test -f squashfs-root/usr/lib/libvlc.so.5
          test -f squashfs-root/usr/lib/vlc/plugins/video_output/libvmem_plugin.so

      - uses: actions/upload-artifact@v7
        with:
          name: TeleDrive-linux-appimage
          path: desktop/build/appimage/*.AppImage
          if-no-files-found: error

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Desktop tests
        run: ./gradlew :desktop:test

      - name: Package .dmg
        run: ./gradlew :desktop:packageDmg

      - uses: actions/upload-artifact@v7
        with:
          name: TeleDrive-macos
          path: desktop/build/compose/binaries/main/dmg/*.dmg
          if-no-files-found: error
